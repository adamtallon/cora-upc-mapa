name: Actualizar mapa

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/generar_json.py
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/datos_mapa.json docs/pendientes.json scripts/geocache.json
          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit -m "Actualizar datos del mapa"
            git push
          fi
