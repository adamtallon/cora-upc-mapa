name: Actualitzar mapa

on:
  schedule:
    - cron: "0 5 * * 1"      # cada dilluns a les 05:00 UTC
  workflow_dispatch:          # permet llançar-ho a mà des de la pestanya Actions

permissions:
  contents: write

jobs:
  actualitzar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instal·lar dependències
        run: pip install requests

      - name: Generar les dades del mapa
        run: python scripts/generar_json.py

      - name: Desar els canvis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/datos_mapa.json docs/pendientes.json scripts/geocache.json
          if git diff --cached --quiet; then
            echo "Sense canvis."
          else
            git commit -m "Actualitzar les dades del mapa"
            git push
          fi
